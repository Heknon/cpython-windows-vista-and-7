name: Build Python 3.12 for Vista SP0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "v3.12/**"
      - ".github/workflows/build-python312-vista-sp0.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            package_arch: x64
          - platform: Win32
            package_arch: x86

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Vista-compatible v140 toolset
        shell: pwsh
        run: ./v3.12/vista-sp0/Install-V140Toolset.ps1

      - name: Apply Vista SP0 compatibility patch
        shell: pwsh
        run: |
          git apply --check ./v3.12/vista-sp0/patches/0001-pre-kb2533623-dll-loading.patch
          git apply ./v3.12/vista-sp0/patches/0001-pre-kb2533623-dll-loading.patch

      - name: Build CPython
        shell: cmd
        env:
          PATCHDIR: ${{ github.workspace }}\v3.12\Python-3.12.10\api-ms-win-core-path-HACK
        run: >-
          v3.12\Python-3.12.10\PCbuild\build.bat
          -p ${{ matrix.platform }}
          -c Release
          "/p:PlatformToolset=v140"
          "/p:WindowsTargetPlatformVersion=10.0.19041.0"

      - name: Create app-local embeddable package
        shell: pwsh
        run: >-
          ./v3.12/vista-sp0/New-EmbedPackage.ps1
          -Platform ${{ matrix.platform }}
          -OutputDirectory "${{ github.workspace }}/artifacts"

      - name: Audit Windows API imports
        shell: pwsh
        run: >-
          ./v3.12/vista-sp0/Test-PeImports.ps1
          -PackageDirectory "${{ github.workspace }}/artifacts/python-3.12.10-vista-sp0-${{ matrix.package_arch }}"

      - name: Run smoke tests on the build host
        shell: pwsh
        run: >-
          & "${{ github.workspace }}/artifacts/python-3.12.10-vista-sp0-${{ matrix.package_arch }}/python.exe"
          "${{ github.workspace }}/v3.12/vista-sp0/smoke_test.py"

      - name: Upload embeddable package
        uses: actions/upload-artifact@v4
        with:
          name: python-3.12.10-vista-sp0-${{ matrix.platform }}
          path: artifacts/python-3.12.10-vista-sp0-*.zip
          if-no-files-found: error
